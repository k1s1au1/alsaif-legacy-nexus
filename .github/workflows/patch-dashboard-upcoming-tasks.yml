name: Patch dashboard upcoming tasks

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-upcoming-tasks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add upcomingTasks prop
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/routes/_authenticated/dashboard.tsx')
          text = path.read_text()
          needle = '          upcomingTrips={eventsData?.trips || []}\n          tasksCount={countsData?.tasks || 0}'
          replacement = '          upcomingTrips={eventsData?.trips || []}\n          upcomingTasks={eventsData?.tasks || []}\n          tasksCount={countsData?.tasks || 0}'
          if 'upcomingTasks={eventsData?.tasks || []}' in text:
              print('already patched')
          elif needle not in text:
              raise SystemExit('IntegratedHub anchor not found')
          else:
              path.write_text(text.replace(needle, replacement, 1))
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/dashboard.tsx
          git commit -m "Wire upcoming tasks into dashboard swipe cards"
          git push

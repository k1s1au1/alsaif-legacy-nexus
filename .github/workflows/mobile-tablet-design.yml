name: Apply mobile tablet visual design layer

on:
  push:
    paths:
      - .github/trigger-mobile-tablet-design

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile/tablet hero visual layer
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/styles.css')
          s = p.read_text()
          marker = '/* ALSAIF_MOBILE_HERO_V2 */'
          if marker in s:
              raise SystemExit('hero layer already exists')
          css = r'''
/* ALSAIF_MOBILE_HERO_V2 */
/* Mobile/tablet visual redesign only. Desktop is intentionally untouched. */
@media (max-width: 1023px) {
  html, body { overflow-x: hidden; }

  /* Home page shell: use the viewport naturally on phones/tablets. */
  main {
    width: 100% !important;
    max-width: none !important;
    margin-inline: 0 !important;
  }

  /* Existing hero is the second section on the dashboard. */
  main > div.max-w-6xl > section:nth-child(2) {
    width: 100% !important;
    padding-inline: 0 !important;
    margin-inline: 0 !important;
  }

  main > div.max-w-6xl > section:nth-child(2) > div {
    width: 100% !important;
    border-radius: 28px !important;
    min-height: 300px !important;
    box-shadow: 0 24px 70px -30px rgba(0,0,0,.75) !important;
  }

  /* Keep the existing hero content/image intact; only improve proportions. */
  main > div.max-w-6xl > section:nth-child(2) > div > div.relative.z-10 {
    padding: 28px 20px !important;
    gap: 22px !important;
  }

  main > div.max-w-6xl > section:nth-child(2) .size-32 {
    width: 104px !important;
    height: 104px !important;
  }

  main > div.max-w-6xl > section:nth-child(2) h2 {
    font-size: clamp(2rem, 9vw, 3rem) !important;
    line-height: 1.12 !important;
    letter-spacing: -.04em !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  main > div.max-w-6xl > section:nth-child(2) .text-white\/60 {
    font-size: 14px !important;
  }

  /* Existing page cards: cleaner mobile rhythm, no new sections. */
  main .card-surface,
  main .glass-surface,
  main .glass-gold-surface {
    border-radius: 22px !important;
  }

  main .grid { gap: 12px !important; }
  main .grid > * { min-width: 0; }

  /* Bottom navigation safe-area only; existing navigation stays intact. */
  body [class*="fixed"][class*="bottom-0"] {
    padding-bottom: max(8px, env(safe-area-inset-bottom)) !important;
  }
}

@media (min-width: 600px) and (max-width: 1023px) {
  main { padding-inline: 24px !important; }
  main > div.max-w-6xl > section:nth-child(2) > div { border-radius: 34px !important; min-height: 360px !important; }
  main > div.max-w-6xl > section:nth-child(2) > div > div.relative.z-10 { padding: 40px 34px !important; gap: 34px !important; }
  main > div.max-w-6xl > section:nth-child(2) .size-32 { width: 132px !important; height: 132px !important; }
}

@media (max-width: 599px) {
  main { padding-inline: 14px !important; }
  main > div.max-w-6xl > section:nth-child(2) > div { min-height: 285px !important; }
}
'''
          p.write_text(s.rstrip() + '\n\n' + css)
      - name: Commit applied CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css
          git diff --cached --quiet || git commit -m "style: redesign existing mobile hero only"
          git push

name: Apply approved mobile family tree design

on:
  push:
    branches:
      - fix/mobile-family-tree-approved-design

permissions:
  contents: write

jobs:
  patch-family-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved family tree UI
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/routes/_authenticated/family-tree.tsx';
          let s = fs.readFileSync(path, 'utf8');

          const canvasClassOld = 'className="family-tree-canvas relative w-full overflow-hidden rounded-[28px] border border-[#DCCDA8] shadow-[0_18px_45px_rgba(40,58,48,0.14)] md:rounded-[34px]"';
          const canvasClassNew = 'className="family-tree-canvas family-tree-approved relative w-full overflow-hidden rounded-[28px] border border-[#DCCDA8] shadow-[0_18px_45px_rgba(40,58,48,0.14)] md:rounded-[34px]"';
          if (!s.includes(canvasClassNew)) {
            if (!s.includes(canvasClassOld)) throw new Error('family tree canvas class anchor not found');
            s = s.replace(canvasClassOld, canvasClassNew);
          }

          const canvasOpen = `${canvasClassNew}\n          >\n`;
          const approvedHeading = `            <div className="family-tree-approved-heading">\n              <div className="family-tree-approved-copy">\n                <span className="family-tree-approved-icon"><Trees size={22} /></span>\n                <div>\n                  <h2>شجرة العائلة</h2>\n                  <p>اكتشف روابط العائلة وتعرّف على أصولك</p>\n                </div>\n              </div>\n              <button\n                type="button"\n                className="family-tree-approved-fit"\n                onClick={() => {\n                  const mobile = typeof window !== "undefined" && window.matchMedia("(max-width: 767px)").matches;\n                  setZoom(mobile ? 0.52 : 0.68);\n                  if (containerRef.current) {\n                    setTranslate({\n                      x: containerRef.current.clientWidth / 2,\n                      y: mobile ? 148 : useNativeIOSNodes ? 112 : 96,\n                    });\n                  }\n                }}\n              >\n                <Maximize2 size={17} />\n                <span>عرض الكل</span>\n              </button>\n            </div>\n`;
          if (!s.includes('className="family-tree-approved-heading"')) {
            if (!s.includes(canvasOpen)) throw new Error('canvas open anchor not found');
            s = s.replace(canvasOpen, canvasOpen + approvedHeading);
          }

          const oldBg = `        .rd3t-tree-container {\n          width: 100%;\n          height: 100%;\n          background-color: #faf7ee;\n          background-image:\n            radial-gradient(circle at 2px 2px, rgba(164, 128, 48, 0.09) 1.2px, transparent 0),\n            linear-gradient(145deg, rgba(255, 255, 255, 0.68), rgba(244, 236, 218, 0.42));\n          background-size: 30px 30px, 100% 100%;\n        }`;
          const newBg = `        .rd3t-tree-container {\n          width: 100%;\n          height: 100%;\n          background-color: #fbf8ef;\n          background-image:\n            linear-gradient(180deg, rgba(255,253,247,0.28), rgba(250,245,232,0.2)),\n            url('/family-tree-background-approved.svg'),\n            radial-gradient(circle at 2px 2px, rgba(164, 128, 48, 0.045) 1px, transparent 0);\n          background-position: center, center bottom, 0 0;\n          background-repeat: no-repeat, no-repeat, repeat;\n          background-size: 100% 100%, min(1080px, 96%) auto, 34px 34px;\n        }`;
          if (!s.includes("family-tree-background-approved.svg")) {
            if (!s.includes(oldBg)) throw new Error('old tree background block not found');
            s = s.replace(oldBg, newBg);
          }

          const touchBlock = `        .family-tree-canvas .rd3t-tree-container,\n        .family-tree-canvas .rd3t-tree-container > svg {\n          touch-action: none;\n          -webkit-user-select: none;\n          user-select: none;\n        }`;
          const approvedStyles = `${touchBlock}\n\n        .family-tree-approved-heading {\n          position: absolute;\n          z-index: 25;\n          top: 16px;\n          right: 18px;\n          left: 18px;\n          display: none;\n          align-items: flex-start;\n          justify-content: space-between;\n          gap: 12px;\n          pointer-events: none;\n        }\n\n        .family-tree-approved-copy {\n          display: flex;\n          align-items: flex-start;\n          gap: 9px;\n          color: #0f5139;\n          text-align: right;\n        }\n\n        .family-tree-approved-icon {\n          display: grid;\n          width: 36px;\n          height: 36px;\n          flex: 0 0 auto;\n          place-items: center;\n          color: #0f5a3f;\n        }\n\n        .family-tree-approved-copy h2 {\n          margin: 0;\n          font-size: 20px;\n          line-height: 1.25;\n          font-weight: 900;\n          letter-spacing: -0.02em;\n        }\n\n        .family-tree-approved-copy p {\n          margin: 3px 0 0;\n          color: #68736d;\n          font-size: 11px;\n          line-height: 1.45;\n          font-weight: 700;\n        }\n\n        .family-tree-approved-fit {\n          pointer-events: auto;\n          display: inline-flex;\n          min-height: 42px;\n          align-items: center;\n          justify-content: center;\n          gap: 7px;\n          border: 1px solid #e1d6b9;\n          border-radius: 15px;\n          background: rgba(255, 253, 247, 0.9);\n          padding: 0 13px;\n          color: #0f5139;\n          font-size: 12px;\n          font-weight: 900;\n          box-shadow: 0 8px 22px rgba(55, 68, 59, 0.08);\n          backdrop-filter: blur(10px);\n        }`;
          if (!s.includes('.family-tree-approved-heading {')) {
            if (!s.includes(touchBlock)) throw new Error('touch block anchor not found');
            s = s.replace(touchBlock, approvedStyles);
          }

          const mobileAnchor = `        @media (max-width: 560px) {\n          .member-panel-content {\n            padding: 15px;\n          }`;
          const mobileReplacement = `        @media (max-width: 767px) {\n          .family-tree-workspace {\n            display: block;\n          }\n\n          .family-tree-workspace > .member-panel {\n            display: none;\n          }\n\n          .family-tree-canvas.family-tree-approved {\n            height: clamp(360px, 42dvh, 470px);\n            min-height: 0;\n            border-radius: 24px;\n            overscroll-behavior-y: auto;\n          }\n\n          .family-tree-approved-heading {\n            display: flex;\n          }\n\n          .family-tree-approved .rd3t-tree-container {\n            background-position: center, center 72%, 0 0;\n            background-size: 100% 100%, 132% auto, 34px 34px;\n          }\n\n          .family-tree-approved .rd3t-tree-container,\n          .family-tree-approved .rd3t-tree-container > svg {\n            touch-action: pan-y !important;\n            overscroll-behavior-y: auto;\n          }\n\n          .family-tree-approved .rd3t-tree-container > svg {\n            padding-top: 54px;\n            box-sizing: border-box;\n          }\n        }\n\n        @media (max-width: 560px) {\n          .member-panel-content {\n            padding: 15px;\n          }`;
          if (!s.includes('height: clamp(360px, 42dvh, 470px)')) {
            if (!s.includes(mobileAnchor)) throw new Error('mobile anchor not found');
            s = s.replace(mobileAnchor, mobileReplacement);
          }

          const oldSmallHeight = `          .family-tree-canvas {\n            min-height: 500px;\n          }`;
          const newSmallHeight = `          .family-tree-canvas:not(.family-tree-approved) {\n            min-height: 500px;\n          }`;
          if (s.includes(oldSmallHeight)) s = s.replace(oldSmallHeight, newSmallHeight);

          fs.writeFileSync(path, s);
          NODE

      - name: Commit patched source
        shell: bash
        run: |
          rm .github/workflows/apply-approved-mobile-family-tree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/family-tree.tsx public/family-tree-background-approved.svg .github/workflows/apply-approved-mobile-family-tree.yml
          git commit -m "تطبيق تصميم شجرة العائلة المعتمد وتحسين التمرير على الجوال"
          git push origin HEAD:${GITHUB_REF_NAME}

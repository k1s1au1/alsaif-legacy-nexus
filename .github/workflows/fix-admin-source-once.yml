name: Fix admin source once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-admin-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch admin source
        run: node .github/scripts/fix-admin-source.cjs

      - name: Commit repaired source and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/fix-admin-source-once.yml
          rm .github/scripts/fix-admin-source.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "إصلاح صفحة الإدارة من المصدر"
          git push origin HEAD:main

name: Restore identity colors setting

on:
  push:
    paths:
      - '.github/workflows/restore-identity-colors-setting.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore identity colors card
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/routes/_authenticated/settings.tsx')
          text = path.read_text()
          needle = '''          </div>\n        </section>\n\n        <section className="space-y-6 animate-fade-up" style={{ animationDelay: "100ms" }}>'''
          replacement = '''          </div>\n\n          <button\n            type="button"\n            onClick={() => setShowColorPicker(true)}\n            className="w-full card-surface p-5 flex items-center justify-between gap-4 text-right transition-all hover:-translate-y-0.5 hover:shadow-xl"\n          >\n            <div className="flex items-center gap-4 min-w-0">\n              <div\n                className="size-12 shrink-0 rounded-2xl flex items-center justify-center text-white shadow-lg"\n                style={{ background: `linear-gradient(135deg, ${currentThemeObj.primary}, ${currentThemeObj.secondary})` }}\n              >\n                <Palette className="size-6" />\n              </div>\n              <div className="min-w-0">\n                <p className="font-black text-primary">ألوان الهوية</p>\n                <p className="text-xs text-muted-foreground mt-1 truncate">{currentThemeObj.name}</p>\n              </div>\n            </div>\n            <span className="btn-gold px-5 py-3 rounded-xl font-black text-xs shrink-0">تغيير</span>\n          </button>\n        </section>\n\n        <section className="space-y-6 animate-fade-up" style={{ animationDelay: "100ms" }}>'''
          if 'onClick={() => setShowColorPicker(true)}' in text:
              print('Identity colors control already present; nothing to do.')
          elif needle not in text:
              raise SystemExit('Expected settings section anchor was not found')
          else:
              path.write_text(text.replace(needle, replacement, 1))
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/settings.tsx
          git commit -m "fix: restore identity colors control"
          git push

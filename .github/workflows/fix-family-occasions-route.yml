name: Fix family occasions route registration

on:
  push:
    paths:
      - .github/trigger-fix-family-occasions-route

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Register family occasions route
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/_authenticated/family-occasions.tsx')
          s = p.read_text()
          marker = 'export const Route = createFileRoute("/_authenticated/family-occasions")'
          if marker not in s:
              needle = 'function FamilyOccasionsPage() {'
              if needle not in s:
                  raise SystemExit('FamilyOccasionsPage marker not found')
              route = 'export const Route = createFileRoute("/_authenticated/family-occasions")({\n  component: FamilyOccasionsPage,\n});\n\n'
              s = s.replace(needle, route + needle, 1)
              p.write_text(s)
      - name: Generate route tree and verify build
        run: npm run build
      - name: Commit route registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/family-occasions.tsx src/routeTree.gen.ts
          git diff --cached --quiet || git commit -m "fix: register family occasions route"
          git push

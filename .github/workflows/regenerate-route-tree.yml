name: Regenerate TanStack route tree

on:
  push:
    paths:
      - .github/trigger-regenerate-route-tree

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route tree and verify build
        run: npm run build
      - name: Commit generated route tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git diff --cached --quiet || git commit -m "fix: register missing family occasions route"
          git push

name: Apply faith content management

on:
  push:
    branches:
      - feature/faith-content-management

permissions:
  contents: write

jobs:
  patch-faith-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard and permissions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          // Dashboard: replace the static strip with the managed widget.
          const dashboardPath = 'src/routes/_authenticated/dashboard.tsx';
          let dashboard = fs.readFileSync(dashboardPath, 'utf8');
          const dashboardImportAnchor = 'import { IntegratedHub } from "@/components/dashboard/integrated-hub";\n';
          const dashboardImport = 'import { SpiritualQuotesWidget } from "@/components/dashboard/spiritual-quotes-widget";\n';
          if (!dashboard.includes(dashboardImport)) {
            if (!dashboard.includes(dashboardImportAnchor)) throw new Error('Dashboard import anchor not found');
            dashboard = dashboard.replace(dashboardImportAnchor, dashboardImportAnchor + dashboardImport);
          }

          const oldDashboardStrip = `        {/* 1. SPIRITUAL REMINDER */}\n        <section className="dashboard-spiritual dashboard-faith-strip animate-fade-up">\n          <div className="dashboard-faith-meta">\n            <div className="dashboard-faith-label">\n              <Scroll size={16} aria-hidden="true" />\n              <span>نفحات إيمانية</span>\n            </div>\n            <span className="dashboard-faith-source">{spiritualQuote.source}</span>\n          </div>\n          <p style={{ fontFamily: "'Amiri', serif" }}>\n            "{spiritualQuote.text}"\n          </p>\n        </section>`;
          const newDashboardStrip = `        {/* 1. SPIRITUAL REMINDER */}\n        <SpiritualQuotesWidget />`;
          if (!dashboard.includes(oldDashboardStrip) && !dashboard.includes('<SpiritualQuotesWidget />')) {
            throw new Error('Dashboard faith strip not found');
          }
          dashboard = dashboard.replace(oldDashboardStrip, newDashboardStrip);
          fs.writeFileSync(dashboardPath, dashboard);

          // Desktop extras: use the same managed data and editor.
          const extrasPath = 'src/components/dashboard/desktop-dashboard-extras.tsx';
          let extras = fs.readFileSync(extrasPath, 'utf8');
          const extrasImportAnchor = 'import { HeritagePortal3D } from "@/components/dashboard/heritage-portal-3d";\n';
          const extrasImport = 'import { SpiritualQuotesWidget } from "@/components/dashboard/spiritual-quotes-widget";\n';
          if (!extras.includes(extrasImport)) {
            if (!extras.includes(extrasImportAnchor)) throw new Error('Desktop extras import anchor not found');
            extras = extras.replace(extrasImportAnchor, extrasImportAnchor + extrasImport);
          }
          const oldDesktopStrip = `            <div className="desktop-faith-strip">\n          <div className="desktop-faith-label">\n            <Scroll size={16} aria-hidden="true" />\n            <b>نفحات إيمانية</b>\n          </div>\n          <p style={{ fontFamily: "'Amiri', serif" }}>\n            "وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا"\n          </p>\n          <span>سورة آل عمران</span>\n        </div>`;
          if (!extras.includes(oldDesktopStrip) && !extras.includes('<SpiritualQuotesWidget variant="desktop" />')) {
            throw new Error('Desktop faith strip not found');
          }
          extras = extras.replace(oldDesktopStrip, '            <SpiritualQuotesWidget variant="desktop" />');
          fs.writeFileSync(extrasPath, extras);

          // Admin: make the faith section assignable to a section head.
          const adminPath = 'src/routes/_authenticated/admin.tsx';
          let admin = fs.readFileSync(adminPath, 'utf8');
          const sectionAnchor = '  { key: "community", label: "ركن الأعضاء" },\n';
          const faithSection = '  { key: "faith", label: "نفحات إيمانية" },\n';
          if (!admin.includes(faithSection)) {
            if (!admin.includes(sectionAnchor)) throw new Error('Admin section options anchor not found');
            admin = admin.replace(sectionAnchor, sectionAnchor + faithSection);
          }
          fs.writeFileSync(adminPath, admin);
          NODE

      - name: Commit patched source
        shell: bash
        run: |
          rm .github/workflows/apply-faith-content-management.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ربط نفحات إيمانية بصلاحية مسؤول القسم"
          git push origin HEAD:${GITHUB_REF_NAME}

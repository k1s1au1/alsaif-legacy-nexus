name: Verify Web App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Check balanced dark identity contrast, saved appearance and light restoration
        run: node scripts/test-balanced-dark.mjs
      - name: Check backup server connection configuration
        run: node --test scripts/test-supabase-server-clients.mjs
      - name: Check backup file saving and retry outcomes
        run: node --test scripts/test-backup-save.mjs
      - name: Check chat read checkpoints and unread counters
        run: node --test scripts/test-chat-read.mjs
      - name: Check member post rotation
        run: npm run test:member-posts
      - name: Check approved account entry
        run: npm run test:account-entry
      - name: Check navigation preferences and permissions
        run: npm run test:navigation
      - name: Check prayer rollover, official Mushaf sources and member bookmarks
        run: npm run test:faith
      - name: Check oasis sunrise, sunset, timezone fallback and legacy prayer caches
        run: node --test scripts/test-council-oasis.mjs
      - name: Check meeting attendance and companion persistence
        run: npm run test:meetings
      - name: Check family occasions in quick follow-up
        run: npm run test:occasions
      - name: Check direct trip status updates
        run: npm run test:trip-status
      - name: Check trip planning and preparation permissions
        run: npm run test:trip-planning
      - name: Check trip image upload failures and storage permissions
        run: node --test scripts/test-trip-image-upload*.mjs
      - name: Check daily unique visits, Saudi midnight and private recording
        run: node --test scripts/test-daily-site-visits*.mjs
      - name: Check family album pagination and search
        run: npm run test:family-album
      - name: Check vault file validation and timed documents
        run: npm run test:vault
      - name: Check Saudi Deal turns, targets and rematches
        run: npm run test:saudi-deal
      - name: Check Baloot timers, fixed teams, tricks and rematches
        run: npm run test:baloot
      - name: Check UNO turns, reconnection and rematches
        run: npm run test:uno
      - name: Check Millionaire game rules
        run: npm run test:millionaire
      - name: Check service worker syntax
        run: node --check public/firebase-messaging-sw.js
      - name: Build web app
        run: npm run build
      - name: Check iPad landscape follow-up swipes, vertical scrolling and card activation in Chrome
        run: node scripts/test-followup-swipe-browser.mjs
      - name: Check balanced dark components and portals on phones, iPads and desktop in Chrome
        run: node scripts/test-balanced-dark-browser.mjs
      - name: Check prayer and Mushafi components on phone, iPad and desktop in Chrome
        run: node scripts/test-faith-browser.mjs
      - name: Check shared ticket cutouts, responsive width and touch actions in Chrome
        run: node scripts/test-trip-ticket-browser.mjs
      - name: Check oasis day and night, prayer placement and daily visitors on all devices in Chrome
        run: node scripts/test-council-visitors-browser.mjs
      - name: Check read-only family statistics on phones, iPads and desktop in Chrome
        run: node scripts/test-family-stats-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faith-component-previews
          path: test-results/faith
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: council-visitor-component-previews
          path: test-results/visitors
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trip-ticket-component-previews
          path: test-results/trip-tickets
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-stats-component-previews
          path: test-results/stats
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balanced-dark-component-previews
          path: test-results/dark
          if-no-files-found: ignore

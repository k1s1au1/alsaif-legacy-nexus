name: Verify Web App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Check backup server connection configuration
        run: node --test scripts/test-supabase-server-clients.mjs
      - name: Check backup file saving and retry outcomes
        run: node --test scripts/test-backup-save.mjs
      - name: Check chat read checkpoints and unread counters
        run: node --test scripts/test-chat-read.mjs
      - name: Check saved display preference and automatic restoration
        run: node --test scripts/test-display-preference.mjs
      - name: Check member post rotation
        run: npm run test:member-posts
      - name: Check approved account entry
        run: npm run test:account-entry
      - name: Check navigation preferences and permissions
        run: npm run test:navigation
      - name: Check prayer rollover, official Mushaf sources and member bookmarks
        run: npm run test:faith
      - name: Check meeting attendance and companion persistence
        run: npm run test:meetings
      - name: Check family occasions in quick follow-up
        run: npm run test:occasions
      - name: Check direct trip status updates
        run: npm run test:trip-status
      - name: Check trip planning and preparation permissions
        run: npm run test:trip-planning
      - name: Check family album pagination and search
        run: npm run test:family-album
      - name: Check vault file validation and timed documents
        run: npm run test:vault
      - name: Check Saudi Deal turns, targets and rematches
        run: npm run test:saudi-deal
      - name: Check Baloot timers, fixed teams, tricks and rematches
        run: npm run test:baloot
      - name: Check UNO turns, reconnection and rematches
        run: npm run test:uno
      - name: Check Millionaire game rules
        run: npm run test:millionaire
      - name: Check service worker syntax
        run: node --check public/firebase-messaging-sw.js
      - name: Build web app
        run: npm run build
      - name: Check desktop display on phone and tablet in Chrome
        run: node scripts/test-display-layout-browser.mjs
      - name: Check prayer and Mushafi components on phone, iPad and desktop in Chrome
        run: node scripts/test-faith-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-layout-previews
          path: test-results/display-layout
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faith-component-previews
          path: test-results/faith
          if-no-files-found: ignore

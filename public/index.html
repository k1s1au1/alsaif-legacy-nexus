<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || ((theme === 'system' || !theme) && supportDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0a1d1c';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#fdfcf7';
          }
        } catch (e) {}
      })();
    </script>
    <style>html.dark #app-loading{background:#0a1d1c!important;color:#ecf0e6!important;color-scheme:dark}</style>
    <meta name="theme-color" content="#064e3b" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="السيف">
    <link rel="apple-touch-icon" href="/logo-home.png">
    <link rel="manifest" href="/manifest.json">
    <title>السيف</title>
  </head>
  <body>
    <div id="app-loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf9f5;color:#075640;font-family:system-ui,sans-serif">جاري تشغيل مجلس العائلة…</div>
    <script>
      window.addEventListener("error", function () {
        document.getElementById("app-loading").textContent = "تعذّر تشغيل التطبيق. أعد فتحه.";
      });
    </script>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>

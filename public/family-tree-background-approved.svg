<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">خلفية شجرة العائلة</title>
  <desc id="desc">شجرة كبيرة هادئة بدرجات عاجية وذهبية وخضراء باهتة للاستخدام كخلفية لشجرة العائلة.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="34%" r="70%">
      <stop offset="0" stop-color="#fffdf6" stop-opacity="0.98"/>
      <stop offset="0.58" stop-color="#f7f0df" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#efe3c8" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d8052"/>
      <stop offset="0.5" stop-color="#b69a67"/>
      <stop offset="1" stop-color="#7b6748"/>
    </linearGradient>
    <radialGradient id="leaf" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#d8c68f"/>
      <stop offset="0.6" stop-color="#b7b68c"/>
      <stop offset="1" stop-color="#7e927b"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g opacity="0.22" filter="url(#wash)" fill="#c7b783">
